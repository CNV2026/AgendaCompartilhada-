<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>Agenda Compartilhada - Crédito Rural</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: faixa verde-escuro no topo, um painel com abas por mês (calendário ou lista) e um modal para agendar o dia. */
:root{
  --bg:#eaf3f2; --surface:#ffffff; --surface-2:#f2f8f7; --ink:#0b2a30; --ink-2:#46656a; --line:#cfe1df;
  --verde-escuro:#003641; --turquesa:#00AE9D; --verde:#7DB61C; --roxo:#49479D;
  --c-out:#00AE9D; --c-out-soft:#d9f2ef; --c-nov:#7DB61C; --c-nov-soft:#e9f4d3; --c-dez:#49479D; --c-dez-soft:#e4e3f4;
  --weekend:#e6f0ef; --hover:#e3f5f2; --ev:#d9f2ef; --ev-mine:#dcefbd; --roxo-text:#49479D;
  --today-bg:#003641; --today-fg:#ffffff;
  --cta:#7DB61C; --cta-fg:#0b2a30; --cta-hover:#8fcb27;
  --ghost-hover:#e3f5f2;
  --danger:#a8231b; --warn-bg:#fff4d6; --warn-line:#e0b84a; --warn-ink:#5a4300;
  --shadow:0 1px 2px rgba(0,54,65,.06),0 10px 28px rgba(0,54,65,.08);
  --ring:#00AE9D;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#05181d; --surface:#0b272e; --surface-2:#0e313a; --ink:#e3f1ef; --ink-2:#9bbabd; --line:#1b4650;
    --c-dez:#8c8ae6; --c-out-soft:#0f3d42; --c-nov-soft:#243c11; --c-dez-soft:#26254f;
    --weekend:#09222a; --hover:#12414a; --ev:#10454b; --ev-mine:#2e4a12; --roxo-text:#a9a7f3;
    --today-bg:#00AE9D; --today-fg:#04262b; --ghost-hover:#12414a;
    --danger:#ff9087; --warn-bg:#3a2e08; --warn-line:#8a6d17; --warn-ink:#f3dc9a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#05181d; --surface:#0b272e; --surface-2:#0e313a; --ink:#e3f1ef; --ink-2:#9bbabd; --line:#1b4650;
  --c-dez:#8c8ae6; --c-out-soft:#0f3d42; --c-nov-soft:#243c11; --c-dez-soft:#26254f;
  --weekend:#09222a; --hover:#12414a; --ev:#10454b; --ev-mine:#2e4a12; --roxo-text:#a9a7f3;
  --today-bg:#00AE9D; --today-fg:#04262b; --ghost-hover:#12414a;
  --danger:#ff9087; --warn-bg:#3a2e08; --warn-line:#8a6d17; --warn-ink:#f3dc9a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* topo */
.top{background:linear-gradient(120deg,#003641 0%,#003641 42%,#00786d 100%);color:#fff}
.top-in{display:flex;flex-wrap:wrap;gap:20px 32px;justify-content:space-between;align-items:flex-end;padding-block:18px 16px}
.brand{min-width:0;flex:1 1 420px}
.eyebrow{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9fe3da}
.logo{margin:0 0 14px;line-height:0}
.top h1{margin:0;font-size:clamp(18px,3vw,24px);line-height:1.08;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.top p.lead{margin:10px 0 0;max-width:58ch;color:#d4ece8;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid rgba(255,255,255,.28);border-radius:999px;font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.08);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:#c9d6d4;display:inline-block}
.chip.live .dot{background:#7DB61C;box-shadow:0 0 0 3px rgba(125,182,28,.28)}
.chip.err .dot,.chip.off .dot{background:#ffb4a8}
.stripe{height:3px;background:linear-gradient(90deg,#7DB61C 0%,#00AE9D 50%,#49479D 100%)}

/* painel */
main.wrap{padding-block:22px 48px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.tabs{display:flex;gap:2px;background:var(--surface-2);border-bottom:1px solid var(--line);padding:0}
.tab{flex:1 1 0;min-width:0;border:0;cursor:pointer;padding:14px 12px 12px;background:var(--c-soft);color:var(--ink);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:inset 0 3px 0 transparent;border-radius:0}
.tab .n{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface);color:var(--ink-2);font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"]{background:var(--surface);box-shadow:inset 0 3px 0 var(--c)}
.tab[aria-pressed="false"]:hover{filter:brightness(.97)}
.tab.out{--c:var(--c-out);--c-soft:var(--c-out-soft)}
.tab.nov{--c:var(--c-nov);--c-soft:var(--c-nov-soft)}
.tab.dez{--c:var(--c-dez);--c-soft:var(--c-dez-soft)}
.bar{display:flex;flex-wrap:wrap;gap:14px 20px;justify-content:space-between;align-items:flex-end;padding:18px 18px 14px}
.bar-l{min-width:0}
.bar h2{margin:0;font-size:24px;line-height:1.15;font-weight:800}
.bar .sum{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.bar-r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--verde-escuro);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:var(--turquesa);color:#04262b}}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--turquesa);color:#04262b}
.inp{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:40px;min-width:0;max-width:100%}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink-2);min-height:40px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--turquesa)}
.btn{border:1px solid transparent;border-radius:10px;padding:9px 16px;min-height:40px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.cta{background:var(--cta);color:var(--cta-fg)}
.btn.cta:hover{background:var(--cta-hover)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--ghost-hover)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.banner{margin:0 18px 14px;padding:10px 14px;border-radius:10px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);font-size:14px}
.body{padding:0 18px 18px}
.hint{margin:0 0 12px;color:var(--ink-2);font-size:14px}

/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dow{background:var(--surface-2);padding:9px 4px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.day{background:var(--surface);border:0;min-height:116px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px;cursor:pointer;position:relative;min-width:0}
.day:hover{background:var(--hover)}
.day.we{background:var(--weekend)}
.day.we:hover{background:var(--hover)}
.day.pad{background:var(--surface-2);cursor:default;pointer-events:none}
.day.past .num{opacity:.55}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:6px}
.num{font-weight:800;font-size:14px;min-width:26px;height:26px;display:inline-grid;place-items:center;border-radius:999px;font-variant-numeric:tabular-nums}
.day.today .num{background:var(--today-bg);color:var(--today-fg);opacity:1}
.hol{font-size:10.5px;font-weight:700;line-height:1.2;color:var(--roxo-text);text-align:right}
.hdot{display:none;width:7px;height:7px;border-radius:50%;background:var(--roxo-text)}
.ev{display:flex;gap:6px;align-items:baseline;font-size:12px;padding:3px 6px;border-radius:6px;background:var(--ev);overflow:hidden;white-space:nowrap;min-width:0}
.ev.mine{background:var(--ev-mine)}
.ev b{font-variant-numeric:tabular-nums;font-weight:800}
.ev span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.more{font-size:11.5px;font-weight:700;color:var(--ink-2);padding-left:6px}
.cnt{display:none;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--turquesa);color:#04262b;font-size:12px;font-weight:800;place-items:center;font-variant-numeric:tabular-nums}
@media (max-width:700px){
  .bar{padding-inline:12px}.body{padding-inline:12px}.banner{margin-inline:12px}
  .day{min-height:62px;padding:6px 3px;align-items:center;gap:6px}
  .dtop{flex-direction:column;gap:3px}
  .ev,.more,.hol{display:none}
  .cnt{display:inline-grid}
  .hdot{display:block}
  .dow{font-size:11px;letter-spacing:.02em;padding-inline:0}
  .tab{font-size:14px;padding-inline:6px}.tab .n{display:none}
}

/* lista */
.grp{margin:0 0 18px}
.grp h3{margin:0 0 8px;font-size:15px;font-weight:800;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.grp h3 small{font-weight:600;color:var(--ink-2);font-size:13px}
.grp.today h3::after{content:"hoje";font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--today-bg);color:var(--today-fg);padding:2px 8px;border-radius:999px}
.rows{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:96px minmax(0,1.2fr) minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:10px 14px;background:var(--surface);border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.mine{background:var(--ev-mine)}
.hr{font-weight:800;font-variant-numeric:tabular-nums}
.who{min-width:0}
.who b{display:block;overflow-wrap:anywhere}
.who span{color:var(--ink-2);font-size:13px;overflow-wrap:anywhere}
.sub{color:var(--ink-2);font-size:13.5px;overflow-wrap:anywhere}
.del{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.del:hover{background:var(--ghost-hover)}
.del.sure{border-color:var(--danger);color:var(--danger)}
.tag{display:inline-block;margin-left:8px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);background:var(--verde);border-radius:999px;padding:1px 8px;vertical-align:middle}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
@media (max-width:700px){
  .row{grid-template-columns:72px minmax(0,1fr) auto}
  .row .sub{grid-column:2 / 3;grid-row:2}
  .row .del{grid-column:3;grid-row:1 / span 2}
}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;padding:0 18px 18px;color:var(--ink-2);font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
@media (max-width:700px){.legend{padding-inline:12px}}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,30,36,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto;z-index:50}
.ov[hidden]{display:none}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.35);width:100%;max-width:760px;margin-block:auto}
.sheet-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px 20px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:16px 16px 0 0}
.sheet-h .eyebrow{color:var(--roxo-text);margin:0 0 4px}
.sheet-h h2{margin:0;font-size:22px;line-height:1.15;font-weight:800;text-wrap:balance}
.x{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-2);flex:none}
.x:hover{background:var(--ghost-hover)}
.sheet-b{padding:16px 20px 20px;display:flex;flex-direction:column;gap:18px}
.sheet-b h3{margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.mini .row{grid-template-columns:96px minmax(0,1fr) auto}
.mini .row .sub{grid-column:2;grid-row:2}
.mini .row .del{grid-column:3;grid-row:1 / span 2}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1 / -1}
.fld>span{font-weight:700;font-size:14px}
.fld>span em{color:var(--danger);font-style:normal}
.fld>span i{font-style:normal;font-weight:500;color:var(--ink-2)}
.fld .inp{width:100%}
.fld .inp[aria-invalid="true"]{border-color:var(--danger)}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:0}
.t2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.warn{grid-column:1 / -1;padding:10px 14px;border-radius:10px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);font-size:14px;font-weight:600}
.warn[hidden]{display:none}
.acts{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:center}
.msg{margin-right:auto;font-size:14px;font-weight:600;color:var(--ink-2)}
.msg.bad{color:var(--danger)}
.note{grid-column:1 / -1;color:var(--ink-2);font-size:13px;margin:-4px 0 0}
@media (max-width:640px){form,.t2{grid-template-columns:1fr}.t2{grid-column:1 / -1}.sheet-b{padding-inline:14px}.sheet-h{padding-inline:14px}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--verde-escuro);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:var(--shadow);z-index:80;max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast{background:var(--turquesa);color:#04262b}}
:root[data-theme="dark"] .toast{background:var(--turquesa);color:#04262b}
@media (prefers-reduced-motion:no-preference){.day,.btn,.tab{transition:background-color .12s ease,filter .12s ease}}
</style>

<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <h1>Agenda Compartilhada - Crédito Rural</h1>
    </div>
    <div class="chips" aria-live="polite">
      <span class="chip" id="chipConn"><i class="dot"></i><span>Conectando</span></span>
      <span class="chip" id="chipTotal">0 agendamentos</span>
      <span class="chip" id="chipAg">0 agências</span>
    </div>
  </div>
</header>
<div class="stripe"></div>

<main class="wrap">
  <section class="panel" aria-label="Calendário de agendamentos">
    <div class="tabs" role="group" aria-label="Mês" id="tabs"></div>
    <div class="bar">
      <div class="bar-l">
        <h2 id="mesTitulo">Outubro de 2026</h2>
        <p class="sum" id="mesResumo"></p>
      </div>
      <div class="bar-r">
        <div class="seg" role="group" aria-label="Visualização">
          <button type="button" id="vCal" aria-pressed="true">Calendário</button>
          <button type="button" id="vLista" aria-pressed="false">Lista</button>
        </div>
        <label class="sr" for="fAgSel">Filtrar por agência</label>
        <select class="inp" id="fAgSel"><option value="">Todas as agências</option></select>
        <label class="chk"><input type="checkbox" id="fMeus"> Somente os meus</label>
        <button type="button" class="btn ghost" id="bCsv" hidden>Exportar CSV</button>
        <button type="button" class="btn cta" id="bNovo">Novo agendamento</button>
      </div>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="body">
      <p class="hint" id="hint" hidden></p>
      <div id="cal"></div>
      <div id="lista" hidden></div>
    </div>
    <div class="legend" aria-label="Legenda">
      <span><i class="sw" style="background:var(--ev-mine)"></i>Seus agendamentos</span>
      <span><i class="sw" style="background:var(--ev)"></i>Agendamentos de outros colaboradores</span>
      <span><i class="sw" style="background:var(--weekend)"></i>Fim de semana</span>
      <span><i class="sw" style="background:var(--roxo-text);border-radius:50%"></i>Feriado nacional</span>
    </div>
  </section>
</main>

<div class="ov" id="ov" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="sheet-h">
      <div>
        <p class="eyebrow">Agendar</p>
        <h2 id="mTitle"></h2>
      </div>
      <button type="button" class="x" id="mClose" aria-label="Fechar">&times;</button>
    </div>
    <div class="sheet-b">
      <section aria-label="Agendamentos do dia">
        <h3>Já agendado neste dia</h3>
        <div class="mini" id="mList"></div>
      </section>
      <form id="f" novalidate>
        <label class="fld"><span>Nome <em>*</em></span><input class="inp" id="fNome" maxlength="80" autocomplete="name" placeholder="Seu nome completo"><small class="err" id="eNome"></small></label>
        <label class="fld"><span>Agência <em>*</em></span><input class="inp" id="fAg" maxlength="80" list="pas" autocomplete="off" placeholder="Escolha ou digite, ex.: PA 07"><datalist id="pas"></datalist><small class="err" id="eAg"></small></label>
        <label class="fld"><span>Data <em>*</em></span><input class="inp" id="fData" type="date" min="2026-10-01" max="2026-12-31"><small class="err" id="eData"></small></label>
        <div class="t2">
          <label class="fld"><span>Início <em>*</em></span><input class="inp" id="fHora" type="time"><small class="err" id="eHora"></small></label>
          <label class="fld"><span>Fim <i>(opcional)</i></span><input class="inp" id="fFim" type="time"><small class="err" id="eFim"></small></label>
        </div>
        <label class="fld full"><span>Assunto <i>(opcional)</i></span><input class="inp" id="fAss" maxlength="160" placeholder="Ex.: reunião de resultado, visita, treinamento"></label>
        <p class="note">Campos com <b>*</b> são obrigatórios.</p>
        <div class="warn" id="fWarn" hidden></div>
        <div class="acts">
          <span class="msg" id="fMsg" role="status"></span>
          <button type="button" class="btn ghost" id="fCancel">Fechar</button>
          <button type="submit" class="btn cta" id="fSave">Agendar</button>
        </div>
      </form>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";

  function validate() {

  function csvCell(v) {

  function exportCsv() {

    var csv = "\ufeff" + rows.map(function (r) { return r.map(csvCell).join(";"); }).join("\r\n");

    $("f").addEventListener("submit", onSubmit);
    ["fNome","fAg","fHora","fFim"].forEach(function (k) { $(k).addEventListener("input", function () { resetWarn(); setMsg(""); }); });
    $("fData").addEventListener("change", function (e) { resetWarn(); if (e.target.value >= INICIO && e.target.value <= FIM) { S.modalDate = e.target.value; renderModalList(); } });
    document.addEventListener("keydown", function (e) {
      if ($("ov").hidden) return;
      if (e.key === "Escape") { e.preventDefault(); closeModal(); return; }
      if (e.key === "Tab") {
        var f = Array.prototype.filter.call($("ov").querySelectorAll("button,input,select,textarea,a[href]"), function (x) { return !x.disabled && x.offsetParent !== null; });
        if (!f.length) return;
        var a = f[0], z = f[f.length - 1];
        if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
        else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
      }
    });
    var dl = $("pas"); PAS.forEach(function (p) { dl.appendChild(h("option", { value: p })); });
  }
  function start() {
    var snapOpts = S.db.collection("agendamentos").orderBy("data").limit(1000);
    snapOpts.onSnapshot(function (snap) {
      var arr = [];
      snap.docs.forEach(function (d) { var it = validItem(d.id, d.data()); if (it) arr.push(it); });
      S.items = sortItems(arr); S.loaded = true; connState("live"); renderAll();
    }, function () { connState("err"); });
  }
  function init() {
    bind(); renderAll();
    $("bCsv").hidden = false;
    var cfg = window.FIREBASE_CONFIG;
    if (!window.firebase || !cfg || !cfg.apiKey || /COLE_AQUI/.test(cfg.apiKey)) { S.dbOff = true; connState("off"); renderAll(); return; }
    try {
      firebase.initializeApp(cfg);
      S.db = firebase.firestore();
      firebase.auth().signInAnonymously().then(function (u) {
        S.myId = u.user.uid; S.canWrite = true; start();
      }).catch(function () { S.canWrite = false; start(); });
    } catch (e) { S.dbOff = true; connState("off"); renderAll(); }
  }
  init();
})();
</script>
